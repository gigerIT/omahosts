name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  hosts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
